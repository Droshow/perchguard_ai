apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "perchguard.fullname" . }}-policies
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "perchguard.labels" . | nindent 4 }}
  annotations:
    # Edit this ConfigMap in place — PerchGuard hot-reloads within 30 seconds,
    # no pod restart required.
data:
  policies.yaml: |
    {{- .Values.policy | nindent 4 }}
