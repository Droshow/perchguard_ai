# ValidatingWebhookConfiguration — Phase 2
#
# This registers PerchGuard as a K8s admission webhook so that
# kubectl apply / agent-created pods are intercepted automatically.
#
# Prerequisites (Phase 2):
#   1. TLS cert for perchguard.perchguard.svc
#      kubectl create secret tls perchguard-tls \
#        --cert=tls.crt --key=tls.key -n perchguard
#   2. CA bundle for the webhook config (base64 of CA cert)
#   3. Deploy with HTTPS (:8443) enabled
#
# Apply:
#   kubectl apply -f webhook-config.yaml
#
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: perchguard
  annotations:
    perchguard/phase: "2"
    perchguard/status: "pending-tls"
webhooks:
  - name: intercept.perchguard.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore         # Ignore = fail open (safe default during dev)
    clientConfig:
      service:
        name: perchguard
        namespace: perchguard
        path: /intercept
        port: 8443
      caBundle: ""
    rules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["pods"]
        scope:       "Namespaced"
    namespaceSelector:
      matchLabels:
        perchguard/intercept: "true"   # opt-in per namespace
