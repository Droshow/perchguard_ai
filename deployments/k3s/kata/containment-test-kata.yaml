# Phase 10f — containment negative control (Kata side). See
# containment-test-runc.yaml for the full rationale; the only intentional
# difference between these two manifests is runtimeClassName.
apiVersion: v1
kind: Pod
metadata:
  name: containment-test-kata
  namespace: redteam-mcp-agent
  labels:
    app: containment-test
    variant: kata
spec:
  restartPolicy: Never
  runtimeClassName: kata-qemu
  nodeSelector:
    perchguard/kata-capable: "true"
  tolerations:
    - key: perchguard.io/agent-workload
      operator: Equal
      value: "true"
      effect: NoSchedule
    - key: perchguard.io/kata-workload
      operator: Equal
      value: "true"
      effect: NoSchedule
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "KERNEL: $(uname -r)"
          echo "PID_COUNT: $(ls /proc | grep -E '^[0-9]+$' | wc -l)"
          echo "DEV_ENTRIES: $(ls /dev | tr '\n' ',')"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
