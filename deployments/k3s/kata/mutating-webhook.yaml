# Phase 10e — Kata RuntimeClass injection webhook (pkg/operator/webhook.KataInjector,
# served by perchguard-operator on :9443).
#
# Deliberately failurePolicy: Ignore, same reasoning as
# deployments/k3s/webhook-config.yaml's intercept webhook: network policy
# (CiliumNetworkPolicy, IsolationEnforcer) is the real enforcement boundary and
# does not depend on this webhook being up. Worst case on webhook downtime is a
# pod scheduled without the Kata sandbox, not an unenforced network boundary.
#
# caBundle is templated in at apply time by deployments/eks/kata.tf (Terraform
# tls_self_signed_cert), not baked in statically here.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: perchguard-kata-injector
  annotations:
    perchguard/phase: "10e"
webhooks:
  - name: kata-inject.perchguard.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    reinvocationPolicy: Never
    clientConfig:
      service:
        name: perchguard-operator
        namespace: perchguard
        path: /mutate-agent-pods-kata
        port: 9443
      caBundle: "${WEBHOOK_CA_BUNDLE}" # substituted by deployments/eks/kata.tf before apply
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: "Namespaced"
    namespaceSelector:
      matchLabels:
        perchguard/sandbox: "kata"   # opt-in per namespace, dogfooded on redteam-mcp-agent first
