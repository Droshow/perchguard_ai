apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: agentisolationpolicies.security.perchguard.io
spec:
  group: security.perchguard.io
  names:
    kind: AgentIsolationPolicy
    listKind: AgentIsolationPolicyList
    plural: agentisolationpolicies
    shortNames:
    - aip
    singular: agentisolationpolicy
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentIsolationPolicy is the cluster-scoped singleton (name: default) that
          translates configs/policies.yaml's egress rules into real Kubernetes objects.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentIsolationPolicySpec defines the desired isolation posture for governed agent
              namespaces. This is a singleton (name: default) in Phase 10b/10c.
            properties:
              egress:
                description: |-
                  EgressPolicy is a 1:1 translation of configs/policies.yaml's dataExfiltration
                  block, plus fields needed to render a coarse NetworkPolicy today and a
                  CiliumNetworkPolicy in Phase 10c.
                properties:
                  allowDNS:
                    description: |-
                      AllowDNS is always true in this phase (DNS is required for any egress to
                      resolve) — not currently configurable, kept as a field for Phase 10c parity.
                    type: boolean
                  allowedDestinations:
                    items:
                      type: string
                    type: array
                  allowedPorts:
                    description: |-
                      AllowedPorts are the ports this phase's coarse NetworkPolicy allows to any
                      destination — plain NetworkPolicy cannot match the hostnames above (Phase 10c,
                      Cilium FQDN rules, does that). Defaults to [443, 80] when empty.
                    items:
                      format: int32
                      type: integer
                    type: array
                  blockUnknownDestinations:
                    type: boolean
                  blockedDestinations:
                    items:
                      type: string
                    type: array
                type: object
              mode:
                description: |-
                  PolicyMode gates whether the operator only renders objects (Observe) or actually
                  applies them to the cluster (Enforce).
                enum:
                - Observe
                - Enforce
                type: string
              sandbox:
                description: SandboxPolicy is inert in this phase — reserved for Phase
                  10c/10d RuntimeClass work.
                properties:
                  enabled:
                    type: boolean
                  runtimeClassName:
                    type: string
                type: object
              sourceConfigRef:
                description: |-
                  SourceConfigRef points at the ConfigMap this policy was translated from, for
                  provenance/drift-detection — keyed off the same content-hash scheme as
                  pkg/policy/watcher.go.
                properties:
                  configMapName:
                    type: string
                  configMapNamespace:
                    type: string
                  contentHash:
                    type: string
                type: object
              workloadSelector:
                description: WorkloadSelector selects which namespaces this policy
                  governs.
                properties:
                  namespaceSelector:
                    description: |-
                      A label selector is a label query over a set of resources. The result of matchLabels and
                      matchExpressions are ANDed. An empty label selector matches all objects. A null
                      label selector matches no objects.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
            type: object
          status:
            description: |-
              AgentIsolationPolicyStatus reports the operator's last-reconciled state.
              NetworkPoliciesApplied/CiliumNetworkPoliciesApplied are pointers, and
              Conditions is a listType=map keyed on Type, so that PolicyTranslator and
              IsolationEnforcer — two reconcilers Server-Side-Applying this one status
              subresource under distinct field owners — can each omit the subfields and
              condition types the other one owns instead of round-tripping a stale
              snapshot of them on every reconcile (a dueling-writer bug a code-review pass
              caught: both reconcilers submitting the same fields under the same owner let
              a stale read-modify-write from one clobber a newer write from the other).
            properties:
              ciliumNetworkPoliciesApplied:
                description: CiliumNetworkPoliciesApplied is owned by IsolationEnforcer.
                properties:
                  count:
                    type: integer
                  namespaces:
                    items:
                      type: string
                    type: array
                required:
                - count
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastAppliedHash:
                description: LastAppliedHash and NetworkPoliciesApplied are owned
                  by PolicyTranslator.
                type: string
              networkPoliciesApplied:
                description: |-
                  NetworkPolicyStatus reports which namespaces currently have a generated
                  NetworkPolicy applied.
                properties:
                  count:
                    type: integer
                  namespaces:
                    items:
                      type: string
                    type: array
                required:
                - count
                type: object
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
