apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-agent
  namespace: healthcare-agent
  labels:
    app.kubernetes.io/name: healthcare-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthcare-agent
  template:
    metadata:
      labels:
        app: healthcare-agent
        app.kubernetes.io/name: healthcare-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534      # nobody
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: healthcare-agent:latest
          imagePullPolicy: IfNotPresent  # use local image in K3s dev
          command: ["sleep", "3600"]     # idle — runs to completion once execed; avoids Deployment restart-looping a one-shot task
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: perchguard-llm
                  key: api-key
                  optional: true
            - name: PERCHGUARD_MCP_URL
              value: "http://perchguard.perchguard.svc.cluster.local:8080"
            - name: CLAUDE_MODEL
              value: "claude-haiku-4-5-20251001"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
